name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      # fetch-depth: 0 (full history) so gitleaks-action below can resolve its
      # commit-range diff. actions/checkout@v4 defaults to a depth-1 shallow
      # clone, which only ever worked here by accident because every push to
      # this repo so far happened to add exactly one commit; a push carrying
      # two or more new commits needs the older commit's parent, which a
      # depth-1 clone doesn't have (broke CI on 2026-07-29's multi-commit push).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # E2E + accessibility — runs against the dev Supabase project via the
      # dedicated e2e-test@chememo.local account (see scripts/create-e2e-user.ts).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

      # Visibility, not a hard gate: the app currently carries pre-existing
      # high-severity findings that trace to next/eslint-config-next's own
      # dependency trees (would need a Next.js major bump to clear) — see
      # this in logs without blocking every otherwise-green run on it.
      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high || true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` applies every file in supabase/migrations/ to a
      # fresh local Postgres via Docker — a SQL error in any migration fails
      # this step, so a green `supabase start` doubles as migration
      # validation. Needs Docker, which this dev machine doesn't have; this
      # job is the only place these RLS tests actually run.
      - run: supabase start

      # Hosted Supabase projects get default table GRANTs to anon/authenticated
      # from the platform's own project bootstrap — that isn't part of any
      # migration file, so a bare `supabase start` (CLI-migrations only) doesn't
      # replicate it. Local-instance-only; never touches dev/prod schema.
      - name: Grant table privileges (local instance only)
        run: |
          eval "$(supabase status -o env)"
          psql "$DB_URL" -c "grant usage on schema public to anon, authenticated, service_role;"
          psql "$DB_URL" -c "grant all on all tables in schema public to anon, authenticated, service_role;"

      - name: Run RLS integration tests
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_LOCAL_URL="$API_URL"
          export SUPABASE_LOCAL_ANON_KEY="$ANON_KEY"
          export SUPABASE_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run test:rls
